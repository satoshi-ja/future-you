<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Future You — 3年後の自分からのメッセージ</title>
    <meta name="description" content="Appleの美学で表現する、未来の自分とのストーリーテリング体験">
    <style>
      /* ============================================
         🍎 Apple HIG Design System v2
         Strict Compliance with Human Interface Guidelines
         ============================================ */
      
      /* Reset */
      *, *::before, *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      
      :root {
        /* ============================================
           PRIMARY COLORS - システムカラー
           ============================================ */
        color-scheme: light dark;
        
        /* Light Mode (Default) */
        --color-label-primary: #000000;
        --color-label-secondary: rgba(60,60,67,0.6);
        --color-label-tertiary: rgba(60,60,67,0.3);
        
        --color-background: #ffffff;
        --color-background-secondary: #f5f5f7;
        --color-background-tertiary: #ffffff;
        
        --color-separator: rgba(60,60,67,0.29);
        --color-separator-opaque: #c6c6c8;
        
        /* ============================================
           ACCENT COLORS - ブランドカラー
           ============================================ */
        --color-accent-blue: #007aff;
        --color-accent-blue-hover: #0051d5;
        --color-accent-gold: #d4a574;
        --color-accent-sage: #8e9b88;
        
        /* ============================================
           SEMANTIC COLORS
           ============================================ */
        --color-success: #34c759;
        --color-warning: #ff9500;
        --color-error: #ff3b30;
        
        /* ============================================
           FONT SCALE - Apple公式スケール準拠
           ============================================ */
        /* Large Title */
        --font-size-largeTitle: clamp(34px, 4vw, 48px);
        --font-weight-largeTitle: 700;
        --line-height-largeTitle: 1.1;
        --letter-spacing-largeTitle: -0.02em;
        
        /* Title 1 */
        --font-size-title1: clamp(28px, 3.2vw, 34px);
        --font-weight-title1: 700;
        --line-height-title1: 1.2;
        --letter-spacing-title1: -0.015em;
        
        /* Title 2 */
        --font-size-title2: clamp(22px, 2.5vw, 28px);
        --font-weight-title2: 700;
        --line-height-title2: 1.25;
        --letter-spacing-title2: -0.01em;
        
        /* Title 3 */
        --font-size-title3: clamp(20px, 2.2vw, 22px);
        --font-weight-title3: 600;
        --line-height-title3: 1.3;
        --letter-spacing-title3: -0.008em;
        
        /* Headline */
        --font-size-headline: 17px;
        --font-weight-headline: 600;
        --line-height-headline: 1.35;
        --letter-spacing-headline: -0.005em;
        
        /* Body */
        --font-size-body: 17px;
        --font-weight-body: 400;
        --line-height-body: 1.47;
        --letter-spacing-body: -0.0025em;
        
        /* Callout */
        --font-size-callout: 16px;
        --font-weight-callout: 400;
        --line-height-callout: 1.375;
        --letter-spacing-callout: -0.0025em;
        
        /* Subheadline */
        --font-size-subheadline: 15px;
        --font-weight-subheadline: 400;
        --line-height-subheadline: 1.33;
        --letter-spacing-subheadline: -0.0025em;
        
        /* Footnote */
        --font-size-footnote: 13px;
        --font-weight-footnote: 400;
        --line-height-footnote: 1.38;
        --letter-spacing-footnote: -0.001em;
        
        /* Caption 1 */
        --font-size-caption1: 12px;
        --font-weight-caption1: 400;
        --line-height-caption1: 1.33;
        --letter-spacing-caption1: 0;
        
        /* ============================================
           SPACING SCALE - 8pxグリッドベース
           ============================================ */
        --space-0: 0;
        --space-1: 4px;
        --space-2: 8px;
        --space-3: 12px;
        --space-4: 16px;
        --space-5: 20px;
        --space-6: 24px;
        --space-8: 32px;
        --space-10: 40px;
        --space-12: 48px;
        --space-16: 64px;
        --space-20: 80px;
        --space-24: 96px;
        --space-32: 128px;
        
        /* Semantic Spacing */
        --container-max-width: 1200px;
        --content-max-width: 692px;
        --container-padding-mobile: 20px;
        --container-padding-tablet: 40px;
        --container-padding-desktop: 80px;
        
        --section-spacing-mobile: 60px;
        --section-spacing-tablet: 80px;
        --section-spacing-desktop: 120px;
        
        /* ============================================
           SHADOWS - Apple式の繊細な影
           ============================================ */
        --shadow-1: 0 1px 3px rgba(0,0,0,0.04), 0 1px 2px rgba(0,0,0,0.06);
        --shadow-2: 0 4px 12px rgba(0,0,0,0.08), 0 2px 4px rgba(0,0,0,0.08);
        --shadow-3: 0 12px 24px rgba(0,0,0,0.12), 0 4px 8px rgba(0,0,0,0.08);
        --shadow-4: 0 20px 40px rgba(0,0,0,0.16), 0 8px 16px rgba(0,0,0,0.12);
        
        /* ============================================
           BORDER RADIUS
           ============================================ */
        --radius-small: 4px;
        --radius-medium: 8px;
        --radius-large: 12px;
        --radius-xlarge: 18px;
        --radius-2xlarge: 24px;
        --radius-full: 9999px;
        
        /* ============================================
           EASING FUNCTIONS
           ============================================ */
        --ease-standard: cubic-bezier(0.4, 0, 0.2, 1);
        --ease-decelerate: cubic-bezier(0, 0, 0.2, 1);
        --ease-accelerate: cubic-bezier(0.4, 0, 1, 1);
        --ease-apple: cubic-bezier(0.28, 0.11, 0.32, 1);
        
        /* ============================================
           DURATION
           ============================================ */
        --duration-instant: 100ms;
        --duration-fast: 200ms;
        --duration-normal: 300ms;
        --duration-slow: 500ms;
        --duration-slower: 800ms;
      }
      
      /* ============================================
         DARK MODE
         ============================================ */
      @media (prefers-color-scheme: dark) {
        :root {
          --color-label-primary: #ffffff;
          --color-label-secondary: rgba(235,235,245,0.6);
          --color-label-tertiary: rgba(235,235,245,0.3);
          
          --color-background: #000000;
          --color-background-secondary: #1c1c1e;
          --color-background-tertiary: #2c2c2e;
          
          --color-separator: rgba(84,84,88,0.65);
          --color-separator-opaque: #38383a;
        }
      }
      
      /* ============================================
         BASE STYLES
         ============================================ */
      html {
        scroll-behavior: smooth;
      }
      
      body {
        margin: 0;
        min-height: 100vh;
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif;
        background: var(--color-background);
        color: var(--color-label-primary);
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        font-size: var(--font-size-body);
        font-weight: var(--font-weight-body);
        line-height: var(--line-height-body);
        letter-spacing: var(--letter-spacing-body);
      }
      
      /* ============================================
         LAYOUT
         ============================================ */
      .container {
        max-width: var(--container-max-width);
        margin: 0 auto;
        padding-left: var(--container-padding-mobile);
        padding-right: var(--container-padding-mobile);
      }
      
      @media (min-width: 768px) {
        .container {
          padding-left: var(--container-padding-tablet);
          padding-right: var(--container-padding-tablet);
        }
      }
      
      @media (min-width: 1024px) {
        .container {
          padding-left: var(--container-padding-desktop);
          padding-right: var(--container-padding-desktop);
        }
      }
      
      .content-wrapper {
        max-width: var(--content-max-width);
        margin: 0 auto;
      }
      
      /* ============================================
         HERO SECTION
         ============================================ */
      .hero {
        position: relative;
        min-height: 100vh;
        min-height: 100svh;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        background: linear-gradient(180deg, #000000 0%, #1a1a1a 100%);
      }
      
      .hero__content {
        position: relative;
        z-index: 2;
        text-align: center;
        padding: 0 var(--container-padding-mobile);
        animation: slideUp 1.2s var(--ease-apple) 0.3s both;
      }
      
      .hero__eyebrow {
        font-size: var(--font-size-subheadline);
        font-weight: var(--font-weight-subheadline);
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: rgba(255,255,255,0.5);
        margin-bottom: 16px;
      }
      
      .hero__title {
        font-size: clamp(48px, 8vw, 96px);
        font-weight: 700;
        letter-spacing: -0.03em;
        line-height: 1;
        color: #ffffff;
        margin-bottom: 20px;
        background: linear-gradient(180deg, #ffffff 0%, rgba(255,255,255,0.8) 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }
      
      .hero__subtitle {
        font-size: var(--font-size-title3);
        font-weight: var(--font-weight-body);
        line-height: 1.4;
        color: rgba(255,255,255,0.7);
        max-width: 600px;
        margin: 0 auto 40px;
      }
      
      .hero__scroll-indicator {
        position: absolute;
        bottom: 40px;
        left: 50%;
        transform: translateX(-50%);
        animation: bounce 2s infinite;
        color: rgba(255,255,255,0.4);
        font-size: var(--font-size-caption1);
        letter-spacing: 0.05em;
      }
      
      @keyframes bounce {
        0%, 20%, 50%, 80%, 100% {
          transform: translateX(-50%) translateY(0);
        }
        40% {
          transform: translateX(-50%) translateY(-10px);
        }
        60% {
          transform: translateX(-50%) translateY(-5px);
        }
      }
      
      @keyframes slideUp {
        from {
          opacity: 0;
          transform: translateY(30px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      
      /* ============================================
         FORM SECTION
         ============================================ */
      .form-section {
        background: var(--color-background-secondary);
        padding: var(--section-spacing-mobile) 0;
      }
      
      @media (min-width: 1024px) {
        .form-section {
          padding: var(--section-spacing-desktop) 0;
        }
      }
      
      .form-card {
        background: var(--color-background-tertiary);
        border-radius: var(--radius-2xlarge);
        padding: clamp(32px, 6vw, 48px);
        box-shadow: var(--shadow-2);
      }
      
      .form-title {
        font-size: var(--font-size-title1);
        font-weight: var(--font-weight-title1);
        line-height: var(--line-height-title1);
        letter-spacing: var(--letter-spacing-title1);
        color: var(--color-label-primary);
        margin-bottom: 12px;
      }
      
      .form-description {
        font-size: var(--font-size-callout);
        line-height: 1.5;
        color: var(--color-label-secondary);
        margin-bottom: 40px;
      }
      
      .form-grid {
        display: grid;
        gap: var(--space-8);
      }
      
      .form-field {
        display: flex;
        flex-direction: column;
        gap: var(--space-2);
      }
      
      .form-label {
        font-size: var(--font-size-subheadline);
        font-weight: var(--font-weight-headline);
        color: var(--color-label-primary);
        letter-spacing: var(--letter-spacing-subheadline);
      }
      
      .form-input,
      .form-select,
      .form-textarea {
        width: 100%;
        font-family: inherit;
        font-size: var(--font-size-body);
        color: var(--color-label-primary);
        background: var(--color-background);
        border: 1px solid var(--color-separator);
        border-radius: var(--radius-medium);
        padding: 12px 16px;
        transition: all var(--duration-fast) var(--ease-apple);
        -webkit-appearance: none;
        appearance: none;
      }
      
      .form-textarea {
        min-height: 120px;
        resize: vertical;
        line-height: var(--line-height-body);
      }
      
      .form-input:focus,
      .form-select:focus,
      .form-textarea:focus {
        outline: none;
        border-color: var(--color-accent-blue);
        box-shadow: 0 0 0 4px rgba(0, 122, 255, 0.1);
      }
      
      .form-input::placeholder,
      .form-textarea::placeholder {
        color: var(--color-label-tertiary);
      }
      
      /* ============================================
         BUTTON
         ============================================ */
      .btn {
        appearance: none;
        border: none;
        background: none;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        font-family: inherit;
        font-size: var(--font-size-body);
        font-weight: 500;
        text-decoration: none;
        transition: all var(--duration-fast) var(--ease-apple);
        position: relative;
        overflow: hidden;
      }
      
      .btn--primary {
        width: 100%;
        padding: 16px 32px;
        background: var(--color-accent-blue);
        color: #ffffff;
        border-radius: var(--radius-full);
        box-shadow: var(--shadow-2);
        margin-top: var(--space-6);
      }
      
      .btn--primary:hover:not(:disabled) {
        background: var(--color-accent-blue-hover);
        transform: translateY(-1px);
        box-shadow: var(--shadow-3);
      }
      
      .btn--primary:active:not(:disabled) {
        transform: translateY(0);
        box-shadow: var(--shadow-1);
      }
      
      .btn--primary:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      
      .btn--secondary {
        padding: 12px 24px;
        background: transparent;
        color: var(--color-accent-blue);
        border: 1.5px solid var(--color-accent-blue);
        border-radius: var(--radius-full);
      }
      
      .btn--secondary:hover {
        background: rgba(0,122,255,0.08);
        transform: translateY(-1px);
      }
      
      /* ============================================
         LOADING & SUCCESS STATES
         ============================================ */
      .state-section {
        background: var(--color-background-secondary);
        padding: var(--section-spacing-mobile) 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      
      .state-card {
        background: var(--color-background-tertiary);
        border-radius: var(--radius-2xlarge);
        padding: clamp(40px, 6vw, 64px);
        box-shadow: var(--shadow-2);
        text-align: center;
        max-width: 560px;
      }
      
      .loading-spinner {
        width: 48px;
        height: 48px;
        margin: 0 auto var(--space-8);
        border: 3px solid var(--color-separator);
        border-top-color: var(--color-accent-blue);
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      
      .success-icon {
        width: 64px;
        height: 64px;
        margin: 0 auto var(--space-6);
        background: var(--color-success);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        animation: scaleIn 0.5s var(--ease-apple);
      }
      
      .success-icon::after {
        content: "✓";
        font-size: 32px;
        color: #ffffff;
        font-weight: 700;
      }
      
      @keyframes scaleIn {
        from {
          opacity: 0;
          transform: scale(0.5);
        }
        to {
          opacity: 1;
          transform: scale(1);
        }
      }
      
      .state-title {
        font-size: var(--font-size-title1);
        font-weight: var(--font-weight-title1);
        line-height: var(--line-height-title1);
        letter-spacing: var(--letter-spacing-title1);
        color: var(--color-label-primary);
        margin-bottom: var(--space-4);
      }
      
      .state-text {
        font-size: var(--font-size-callout);
        line-height: 1.5;
        color: var(--color-label-secondary);
        margin-bottom: var(--space-8);
      }
      
      .state-actions {
        display: flex;
        flex-direction: column;
        gap: var(--space-4);
      }
      
      .error-message {
        margin-top: var(--space-6);
        padding: var(--space-4);
        background: rgba(255, 59, 48, 0.08);
        border: 1px solid rgba(255, 59, 48, 0.2);
        border-radius: var(--radius-medium);
        color: var(--color-error);
        font-size: var(--font-size-subheadline);
        text-align: left;
        display: none;
      }
      
      .error-message.active {
        display: block;
      }
      
      /* ============================================
         UTILITY CLASSES
         ============================================ */
      .hidden {
        display: none !important;
      }
      
      /* ============================================
         FOCUS STYLES - アクセシビリティ
         ============================================ */
      *:focus {
        outline: none;
      }
      
      *:focus-visible {
        outline: 2px solid var(--color-accent-blue);
        outline-offset: 3px;
        border-radius: var(--radius-small);
      }
      
      /* ============================================
         REDUCED MOTION
         ============================================ */
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
        }
      }
      
      /* ============================================
         RESPONSIVE
         ============================================ */
      @media (max-width: 733px) {
        .hero__content {
          padding: 0 var(--space-5);
        }
        
        .form-section {
          padding: var(--space-20) 0;
        }
      }
    </style>
  </head>
  <body>
    <!-- ============================================
         HERO SECTION
         ============================================ -->
    <section id="hero" class="hero">
      <div class="hero__content">
        <div class="hero__eyebrow">Future You</div>
        <h1 class="hero__title">未来の自分に<br>会いに行く</h1>
        <p class="hero__subtitle">
          3年後の理想の自分から、今のあなたへメッセージが届きます
        </p>
      </div>
      <div class="hero__scroll-indicator">SCROLL</div>
    </section>

    <!-- ============================================
         FORM SECTION
         ============================================ -->
    <section id="form-section" class="form-section">
      <div class="container">
        <div class="content-wrapper">
          <div class="form-card">
            <h2 class="form-title">あなたについて教えてください</h2>
            <p class="form-description">
              あなたの夢や目標、大切にしている価値観を教えてください。<br>
              未来のあなたからのメッセージを生成します。
            </p>
            
            <form id="future-form" class="form-grid">
              <div class="form-field">
                <label for="q3" class="form-label">性別（任意）</label>
                <select id="q3" name="q3" class="form-select">
                  <option value="">選択してください</option>
                  <option value="female">女性</option>
                  <option value="male">男性</option>
                  <option value="nonbinary">ノンバイナリー</option>
                  <option value="prefer_not_to_say">回答しない</option>
                </select>
              </div>
              
              <div class="form-field">
                <label for="q4" class="form-label">3年後の理想の仕事イメージ</label>
                <textarea 
                  id="q4" 
                  name="q4" 
                  class="form-textarea" 
                  required 
                  minlength="10" 
                  placeholder="例: グローバルな開発チームを率いて、革新的なAIプロダクトを成功させている。"
                ></textarea>
              </div>
              
              <div class="form-field">
                <label for="q5" class="form-label">3年後の理想のプライベートイメージ</label>
                <textarea 
                  id="q5" 
                  name="q5" 
                  class="form-textarea" 
                  required 
                  minlength="10" 
                  placeholder="例: 家族と過ごす時間も大切にしながら、自分の趣味も充実している。"
                ></textarea>
              </div>
              
              <div class="form-field">
                <label for="q6" class="form-label">3年後の理想の人間関係</label>
                <textarea 
                  id="q6" 
                  name="q6" 
                  class="form-textarea" 
                  required 
                  minlength="10" 
                  placeholder="例: 信頼し合える仲間に囲まれ、それぞれの強みを尊重しながら成長している。"
                ></textarea>
              </div>
              
              <div class="form-field">
                <label for="q7" class="form-label">大切にしている価値観</label>
                <textarea 
                  id="q7" 
                  name="q7" 
                  class="form-textarea" 
                  required 
                  minlength="5" 
                  placeholder="例: 誠実さ、挑戦、仲間との協力"
                ></textarea>
              </div>
              
              <div class="form-field">
                <label for="q8" class="form-label">ニックネーム</label>
                <input 
                  id="q8" 
                  name="q8" 
                  type="text" 
                  class="form-input" 
                  required 
                  minlength="2" 
                  maxlength="40" 
                  placeholder="例: みらい太郎"
                />
              </div>
              
              <button type="submit" id="submit-button" class="btn btn--primary">
                未来の自分に会いに行く
              </button>
            </form>
            
            <div id="form-error" class="error-message"></div>
          </div>
        </div>
      </div>
    </section>

    <!-- ============================================
         LOADING STATE
         ============================================ -->
    <section id="loading-section" class="state-section hidden">
      <div class="container">
        <div class="content-wrapper">
          <div class="state-card">
            <div class="loading-spinner"></div>
            <h2 class="state-title">未来からのメッセージを準備中...</h2>
            <p class="state-text">
              GPT-4がストーリーを考え、Sora2が映像を生成しています。<br>
              数十秒お待ちください。
            </p>
          </div>
        </div>
      </div>
    </section>

    <!-- ============================================
         SUCCESS STATE
         ============================================ -->
    <section id="success-section" class="state-section hidden">
      <div class="container">
        <div class="content-wrapper">
          <div class="state-card">
            <div class="success-icon"></div>
            <h2 class="state-title">メッセージの準備ができました</h2>
            <p id="success-message" class="state-text"></p>
            <p id="success-detail" class="state-text"></p>
            <div class="state-actions">
              <button type="button" id="open-page" class="btn btn--primary">
                生成されたページを開く
              </button>
              <button type="button" id="create-again" class="btn btn--secondary">
                もう一度作成する
              </button>
            </div>
            <div id="success-error" class="error-message"></div>
          </div>
        </div>
      </div>
    </section>

    <!-- ============================================
         JAVASCRIPT
         ============================================ -->
    <script>
      const hero = document.getElementById('hero');
      const formSection = document.getElementById('form-section');
      const loadingSection = document.getElementById('loading-section');
      const successSection = document.getElementById('success-section');
      const form = document.getElementById('future-form');
      const submitButton = document.getElementById('submit-button');
      const formError = document.getElementById('form-error');
      const successMessage = document.getElementById('success-message');
      const successDetail = document.getElementById('success-detail');
      const successError = document.getElementById('success-error');
      const openPageBtn = document.getElementById('open-page');
      const createAgainBtn = document.getElementById('create-again');

      let latestPageUrl = null;
      let autoOpenTimer = null;

      // Show specific section
      const showSection = (section) => {
        [hero, formSection, loadingSection, successSection].forEach(s => {
          s.classList.add('hidden');
        });
        section.classList.remove('hidden');
      };

      // Error handling
      const showError = (message, context = 'form') => {
        const errorEl = context === 'form' ? formError : successError;
        errorEl.textContent = message;
        errorEl.classList.add('active');
      };

      const hideErrors = () => {
        formError.classList.remove('active');
        successError.classList.remove('active');
      };

      // Form submission
      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        hideErrors();

        const payload = {
          q3: form.q3.value,
          q4: form.q4.value.trim(),
          q5: form.q5.value.trim(),
          q6: form.q6.value.trim(),
          q7: form.q7.value.trim(),
          q8: form.q8.value.trim(),
        };

        if (!payload.q4 || !payload.q5 || !payload.q6 || !payload.q7 || !payload.q8) {
          showError('必須項目をすべて入力してください。');
          return;
        }

        submitButton.disabled = true;
        showSection(loadingSection);

        try {
          const response = await fetch('/api/generate', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload),
          });

          if (!response.ok) {
            const errorBody = await response.json().catch(() => null);
            const message = errorBody?.error || '生成中にエラーが発生しました。時間を置いて再度お試しください。';
            throw new Error(message);
          }

          const data = await response.json();
          latestPageUrl = data.pageUrl;

          successMessage.textContent = data.message || '未来からのメッセージが届きました。';
          successDetail.textContent = '2秒後に自動で新しいページが開きます。';
          showSection(successSection);

          if (autoOpenTimer) {
            clearTimeout(autoOpenTimer);
          }
          autoOpenTimer = setTimeout(() => {
            if (latestPageUrl) {
              window.open(latestPageUrl, '_blank');
            }
          }, 2000);
        } catch (error) {
          submitButton.disabled = false;
          showSection(formSection);
          showError(error.message || '未知のエラーが発生しました。');
        }
      });

      // Open page button
      openPageBtn.addEventListener('click', () => {
        if (latestPageUrl) {
          window.open(latestPageUrl, '_blank');
        } else {
          showError('ページURLが取得できませんでした。', 'success');
        }
      });

      // Create again button
      createAgainBtn.addEventListener('click', () => {
        hideErrors();
        latestPageUrl = null;
        submitButton.disabled = false;
        showSection(formSection);
        // Smooth scroll to form
        formSection.scrollIntoView({ behavior: 'smooth' });
      });

      // Smooth scroll to form on scroll indicator click
      document.querySelector('.hero__scroll-indicator').addEventListener('click', () => {
        formSection.scrollIntoView({ behavior: 'smooth' });
      });
    </script>
  </body>
</html>
